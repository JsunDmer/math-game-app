name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: math-game-app/package-lock.json

      - name: Install dependencies
        run: |
          cd math-game-app
          npm ci

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: |
          cd math-game-app
          npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x math-game-app/android/gradlew

      - name: Build with Gradle
        run: cd math-game-app/android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: learning-paradise-debug
          path: math-game-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
