<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FF6B9D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>🌈 Learning Paradise</title>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/design-system.css">
  <style>
    .page {
      display: none;
      height: calc(100vh - 80px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 20px;
    }

    .page.active {
      display: block;
    }

    .page-title {
      font-size: 28px;
      font-weight: bold;
      color: var(--text-primary);
      margin-bottom: 20px;
      text-align: center;
    }

    .game-container {
      padding: 20px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .progress-panel {
      display: flex;
      justify-content: space-around;
      padding: 16px;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      margin-top: 20px;
    }

    .progress-item {
      text-align: center;
    }

    .progress-value {
      font-size: 24px;
      font-weight: bold;
      color: var(--primary-pink);
    }

    .progress-label {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      margin-bottom: 12px;
    }

    .setting-label {
      font-size: 18px;
      color: var(--text-primary);
    }

    .toggle-switch {
      width: 52px;
      height: 28px;
      background: #ccc;
      border-radius: 14px;
      position: relative;
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .toggle-switch.active {
      background: var(--success);
    }

    .toggle-switch::after {
      content: '';
      width: 24px;
      height: 24px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: var(--transition-fast);
    }

    .toggle-switch.active::after {
      left: 26px;
    }

    .music-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 12px 0;
    }

    .music-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: var(--transition-fast);
      border: 2px solid transparent;
    }

    .music-item:hover {
      background: var(--bg-secondary);
    }

    .music-item.active {
      border-color: var(--primary-pink);
      background: rgba(255, 107, 157, 0.1);
    }

    .music-icon {
      font-size: 24px;
    }

    .music-name {
      font-size: 16px;
      color: var(--text-primary);
    }

    .volume-slider {
      width: 120px;
      height: 8px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--bg-secondary);
      border-radius: 4px;
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      background: var(--primary-pink);
      border-radius: 50%;
      cursor: pointer;
    }

    .setting-section {
      padding: 0 20px;
      margin-top: 12px;
    }

    .about-section {
      padding: 20px;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      margin-top: 20px;
      text-align: center;
    }

    .about-title {
      font-size: 20px;
      font-weight: bold;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .about-version {
      font-size: 14px;
      color: var(--text-secondary);
    }

    body {
      padding-bottom: 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 英语标签页 -->
    <div id="english-page" class="page active">
      <div class="game-container">
        <div class="game-grid" id="english-games"></div>
        <div class="progress-panel" style="margin-top: 12px; padding: 12px;">
          <div class="progress-item">
            <div class="progress-value" style="font-size: 28px;">⭐ <span id="stars-count-en">0</span></div>
            <div class="progress-label">星星总数</div>
          </div>
          <div class="progress-item">
            <div class="progress-value" style="font-size: 28px;">📚 <span id="words-count">0</span></div>
            <div class="progress-label">学习单词</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 数学标签页 -->
    <div id="math-page" class="page">
      <div class="game-container">
        <div class="game-grid" id="math-games"></div>
        <div class="progress-panel" style="margin-top: 12px; padding: 12px;">
          <div class="progress-item">
            <div class="progress-value" style="font-size: 28px;">⭐ <span id="stars-count-math">0</span></div>
            <div class="progress-label">星星总数</div>
          </div>
          <div class="progress-item">
            <div class="progress-value" style="font-size: 28px;">🎯 <span id="completed-count">0</span></div>
            <div class="progress-label">通关次数</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 设置标签页 -->
    <div id="settings-page" class="page">
      <div class="game-container">
        <h1 class="page-title">⚙️ 设置</h1>

        <div class="setting-item">
          <span class="setting-label">🔊 声音效果</span>
          <div class="toggle-switch active" id="toggle-sound" onclick="toggleSound()"></div>
        </div>

        <div class="setting-item">
          <span class="setting-label">🎵 背景音乐</span>
          <div class="toggle-switch" id="toggle-music" onclick="toggleMusic()"></div>
        </div>

        <div class="setting-section" id="music-controls" style="display: none;">
          <div class="setting-item">
            <span class="setting-label">选择音乐</span>
          </div>
          <div class="music-list" id="music-list"></div>
          
          <div class="setting-item">
            <span class="setting-label">🔊 音量</span>
            <input type="range" min="0" max="100" value="50" 
                   class="volume-slider" id="volume-slider" 
                   oninput="setVolume(this.value)">
          </div>
        </div>

        <div class="about-section">
          <div class="about-title">🌈 Learning Paradise</div>
          <div class="about-version">Version 1.0.0</div>
          <div class="about-version" style="margin-top: 8px;">专为儿童设计的学习乐园</div>
        </div>
      </div>
    </div>

    <!-- 游戏页面 -->
    <div id="game-page" class="page">
      <div id="game-content" class="game-container"></div>
    </div>

    <!-- 底部导航 -->
    <nav class="bottom-tab-bar">
      <button class="tab-btn active" id="tab-english" onclick="showEnglishTab()">
        <span class="icon">🔤</span>
        <span class="label">英语</span>
      </button>
      <button class="tab-btn" id="tab-math" onclick="showMathTab()">
        <span class="icon">🔢</span>
        <span class="label">数学</span>
      </button>
      <button class="tab-btn" id="tab-settings" onclick="showSettingsTab()">
        <span class="icon">⚙️</span>
        <span class="label">设置</span>
      </button>
    </nav>
  </div>

  <script src="js/core/progress-manager.js"></script>
  <script src="js/core/voice-manager.js"></script>
  <script src="js/core/letter-audio-manager.js"></script>
  <script src="js/core/audio-manager.js"></script>
  <script src="js/core/music-manager.js"></script>
  <script src="js/games/english/letters-match.js"></script>
  <script src="js/games/english/word-select.js"></script>
  <script src="js/games/english/listen-identify.js"></script>
  <script src="js/games/english/letter-sort.js"></script>
  <script src="js/games/english/word-puzzle.js"></script>
  <script src="js/games/english/letter-center.js"></script>
  <script src="js/games/math/counting.js"></script>
  <script src="js/games/math/number-match.js"></script>
  <script src="js/games/math/number-sort.js"></script>
  <script src="js/games/math/addition.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
